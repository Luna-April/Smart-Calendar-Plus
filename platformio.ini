; Smart Calendar - ESP32-C3 desktop e-paper calendar
; Experiment 01: board bring-up / serial heartbeat test

[env:smart-calendar]
platform = espressif32@6.12.0
; WEMOS LOLIN C3 Mini is the closest stock definition to the ESP32-C3 SuperMini:
; 4 MB flash, native USB Serial/JTAG (VID 303A:PID 1001), no USB-UART bridge.
board = lolin_c3_mini
framework = arduino

monitor_speed = 115200
upload_speed = 460800

build_flags =
    -D CORE_DEBUG_LEVEL=0

; Do not hardcode a port: /dev/ttyACM0 on this machine belongs to a USB camera.
; PlatformIO filters candidates by the board's USB VID/PID (303A:1001).
