name: Firmware
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install platformio==6.2.0
      - run: python tools/embed_album.py --check
      - run: g++ -std=c++11 tests/photo_codec_test.cpp -o /tmp/photo-test && /tmp/photo-test
      - run: pio run
      - uses: actions/upload-artifact@v4
        with:
          name: photo-album-firmware
          path: .pio/build/smart-calendar/firmware.bin
